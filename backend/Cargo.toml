[package]
name = "fiszki-server"
version = "0.1.0"
edition = "2021"
description = "Fiszki – personal flashcards server (Rust + SQLite + Gemini extraction)"
license = "MIT"

[[bin]]
name = "fiszki-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dotenvy = "0.15"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
